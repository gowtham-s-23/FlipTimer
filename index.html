<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="titlebar">
        <div class="titlebar-drag">
          <span class="app-name">Flip Timer</span>
          <span class="pin-badge" id="pinBadge" title="Always on top">On top</span>
        </div>
        <div class="titlebar-actions">
          <button type="button" class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="transparentBtn" title="Toggle transparent background" aria-label="Toggle transparent background" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke-dasharray="3 3" />
              <path d="M8 16l8-8M9 8h.01M15 16h.01" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="setupBtn" title="Set timer & task" aria-label="Setup">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="minimizeBtn" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 12h14" />
            </svg>
          </button>
          <button type="button" class="icon-btn danger" id="closeBtn" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </header>

      <main class="stage">
        <p class="task-label" id="taskLabel">No task set</p>

        <div class="flip-clock" id="flipClock" aria-live="polite" aria-atomic="true">
          <div class="unit" data-unit="hours">
            <div class="digit-pair" data-pair="hours"></div>
            <span class="unit-caption">hrs</span>
          </div>
          <span class="colon" aria-hidden="true">:</span>
          <div class="unit" data-unit="minutes">
            <div class="digit-pair" data-pair="minutes"></div>
            <span class="unit-caption">min</span>
          </div>
          <span class="colon" aria-hidden="true">:</span>
          <div class="unit" data-unit="seconds">
            <div class="digit-pair" data-pair="seconds"></div>
            <span class="unit-caption">sec</span>
          </div>
        </div>

        <div class="controls">
          <button type="button" class="ctrl-btn" id="startPauseBtn">Start</button>
          <button type="button" class="ctrl-btn ghost" id="resetBtn">Reset</button>
          <button type="button" class="ctrl-btn ghost solid-mode-btn" id="exitTransparentBtn" title="Exit transparent mode">
            Solid
          </button>
        </div>
      </main>

      <section class="setup-panel" id="setupPanel" hidden>
        <label class="field">
          <span>Task</span>
          <input type="text" id="taskInput" maxlength="80" placeholder="What are you focusing on?" />
        </label>
        <div class="duration-row">
          <label class="field compact">
            <span>Hours</span>
            <input type="number" id="hoursInput" min="0" max="99" value="0" />
          </label>
          <label class="field compact">
            <span>Minutes</span>
            <input type="number" id="minutesInput" min="0" max="59" value="25" />
          </label>
          <label class="field compact">
            <span>Seconds</span>
            <input type="number" id="secondsInput" min="0" max="59" value="0" />
          </label>
        </div>
        <div class="presets">
          <button type="button" class="preset" data-mins="5">5m</button>
          <button type="button" class="preset" data-mins="15">15m</button>
          <button type="button" class="preset" data-mins="25">25m</button>
          <button type="button" class="preset" data-mins="45">45m</button>
          <button type="button" class="preset" data-mins="60">1h</button>
        </div>
        <label class="toggle-row">
          <input type="checkbox" id="transparentToggle" />
          <span>Transparent background</span>
        </label>
        <button type="button" class="ctrl-btn primary" id="applyBtn">Apply</button>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
